{% extends "layout.html" %}
{% block content %}
<h3>Enter Results: {{ test.test_type }}</h3>
<p>Patient: {{ test.patient.name }} (ID: {{ test.patient.id }})</p>
<form method="POST">
    <textarea name="result" class="form-control" rows="5" placeholder="Enter clinical findings and values..." required></textarea>
    <br>
    <button class="btn btn-primary">Submit for Approval</button>
</form>
{% endblock %}
